[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_llm_proxy"]

[project]
name = "open-llm-proxy"
version = "0.1.0"
description = "Lightweight litellm Router proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm[proxy]",
    "prisma",
    "httpx[http2]",
    "pyyaml"
]

[project.scripts]
open-llm-proxy = "open_llm_proxy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest"
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
